<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A8F4B"><title>Safe Scan Eats</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7FAF5;color:#18392a;font:18px system-ui,sans-serif}main{max-width:420px;padding:32px}img{border-radius:24px}h1{font-size:28px}p{line-height:1.6}button,a{display:inline-block;padding:14px 20px;border:0;border-radius:16px;background:#0A8F4B;color:white;font:inherit;text-decoration:none;cursor:pointer}a{margin-left:8px;background:#e0ede3;color:#18392a}</style></head><body><main><h1 id="heading">Connessione non disponibile</h1><p id="message">Safe Scan ha bisogno di Internet per cercare prodotti e aggiornare le informazioni. Controlla la connessione e riprova.</p><button id="retry" onclick="location.reload()">Riprova</button><a id="home" href="/">Home</a></main><script>try{if(localStorage.getItem('safe-scan-eats-language-v1')==='en'){document.documentElement.lang='en';document.getElementById('heading').textContent='No internet connection';document.getElementById('message').textContent='Safe Scan needs the internet to search for products and update information. Check your connection and try again.';document.getElementById('retry').textContent='Try again';}}catch{}</script></body></html>
