name: Mobile Native Scaffold

on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "src/**"
      - "public/app-icon.svg"
      - "scripts/mobile-init.mjs"
      - "scripts/generate-mobile-assets.mjs"
      - ".github/workflows/mobile-native.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - run: npm run mobile:init
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: safe-scan-eats-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  ios-project:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run mobile:init
      - name: Build unsigned iOS app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphoneos -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R ios-build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -qry safe-scan-eats-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: safe-scan-eats-ios-unsigned
          path: safe-scan-eats-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: safe-scan-eats-ios-project
          path: ios
